<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Candlestick bar background -->
  <line x1="256" y1="100" x2="256" y2="412" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round" />
  <rect x="242" y="196" width="28" height="120" rx="4" fill="#f59e0b" fill-opacity="0.75" />
  
  <!-- Stylized N Insignia -->
  <g filter="url(#glow)">
    <line x1="150" y1="380" x2="150" y2="132" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" />
    <line x1="362" y1="380" x2="362" y2="132" stroke="#10b981" stroke-width="32" stroke-linecap="round" />
    <line x1="150" y1="132" x2="362" y2="380" stroke="url(#nGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Joint nodes -->
    <circle cx="150" cy="132" r="18" fill="#38bdf8" />
    <circle cx="150" cy="380" r="18" fill="#38bdf8" />
    <circle cx="362" cy="132" r="18" fill="#10b981" />
    <circle cx="362" cy="380" r="18" fill="#10b981" />
    
    <!-- Center quantum core -->
    <circle cx="256" cy="256" r="22" fill="#ffffff" stroke="#f59e0b" stroke-width="6" />
  </g>
</svg>
